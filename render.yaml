# Blueprint Render : Dashboard → New → Blueprint → choisir ce dépôt.
# Crée le service web de l'API d'abonnement (dossier server/).
services:
  - type: web
    name: dialaw-tv-api
    runtime: node
    plan: free
    # Même région que la base Neon (AWS us-east-2, Ohio).
    region: ohio
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Signature des sessions de l'espace admin : générée par Render.
      - key: SESSION_SECRET
        generateValue: true
      # Valeurs secrètes : demandées par Render à la création, jamais dans Git.
      - key: DATABASE_URL
        sync: false
      # Mot de passe du propriétaire : se connecter à /admin pour nommer les admins.
      - key: ADMIN_MASTER_PASSWORD
        sync: false
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
